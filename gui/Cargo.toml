[workspace]
resolver = "3"
# `spike` is the throwaway egui probe for the GPUI exit spike
# (specs/epics/E00-spike.md); deleted at cutover.
members = [".", "spike"]

[package]
name = "kage-desktop"
version = "0.3.0"
edition = "2024"
# Kept at 1.95 from the GPUI days; the msrv gui leg in CI enforces
# this floor.
rust-version = "1.95"
description = "The kage desktop client"
license = "MIT"
publish = false

[lib]
# cdylib so the wasm bundle carries the exported web entry; rlib for the
# native binary and tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The egui stack. glow renders; wgpu stays available as a fallback
# feature (decision D1). default_fonts keeps egui's Latin faces; the
# CJK coverage arrives with E05's system font discovery.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg"] }
egui_commonmark = { version = "0.25", features = ["better_syntax_highlighting"] }
egui_virtual_list = "0.12"
# Syntax highlighting for the transcript's code blocks; the
# `default-fancy` flavor keeps the fancy regex engine.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
kage-client = { path = "../crates/kage-client" }
async-channel = "2.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# `std::time::Instant::now` panics in the browser; this one reads
# `performance.now` there and is std on native.
web-time = "1"
# Local wall-clock labels.
chrono = "0.4"
# The config.toml preview the settings forms show.
toml = "1"

[build-dependencies]
# The Windows executable icon embed, gated by `build.rs` to the
# windows target.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# System font discovery for the CJK fallback: fontconfig on Linux
# through its dlopen mode, so the binary never hard-links the C
# library, CoreText on macOS and DirectWrite on Windows.
fontique = { version = "0.9", default-features = false, features = [
    "std",
    "system",
    "fontconfig-dlopen",
] }
# Plain WebSocket client, no TLS: kage serves loopback ws:// only.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Decodes the embedded brand art for the window icon.
image = { version = "0.25", default-features = false, features = ["png"] }
# Fetches the release list and the engine binary for the update
# check and the setup screen download; rustls, so no system OpenSSL.
ureq = "2.10"
# Unpacks the engine release archive (tar.xz, or zip on Windows) in
# the setup screen's downloader.
compak = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Exact versions so the wasm-bindgen CLI (0.2.129 installed) stays in
# sync with the crate, same rule as the gui workspace lock.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
# `Date.now`, the browser clock behind `clock::unix_seconds`.
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "BinaryType",
    "Document",
    "Location",
    "MessageEvent",
    "Storage",
    "WebSocket",
    "Window",
] }

# Size and speed for shipped binaries, after soar's profile. Nothing in
# the client recovers from a panic, so aborting drops the unwind tables.
# T01.1.3: fat (lto = true) vs thin measured in the E01 results; fat
# builds the whole app tree clean in ~70s on 16 cores.
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dev-dependencies]
# The headless harness the E01 theme and icon probes render through.
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
